<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E3338">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Apontamento de Lavagem — Nova Rota</title>
<style>
/* ============ CORES ============ */
:root{
  --asfalto:#2E3338; --faixa:#F2B705; --ok:#2E7D4F; --ok-bg:#E3F1E8; --falha:#B3261E; --falha-bg:#F9E3E1; --aviso:#8A5A00; --aviso-bg:#FFF1CC;
  --bg:#F3F4F5; --card:#FFFFFF; --text:#1F2326; --muted:#5E646A; --line:#D5D8DB; --input:#FFFFFF; --chip:#ECEEF0;
  color-scheme: light;
  font-family: Bahnschrift, "DIN Alternate", "Barlow", "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1A1D20; --card:#262B30; --text:#ECEDEE; --muted:#A9AFB5; --line:#3D444B; --input:#1F2327; --chip:#333A40;
    --ok-bg:#1F3A2A; --falha-bg:#4A1F1C; --aviso-bg:#43360F; --ok:#7FD39C; --falha:#FF8A80; --aviso:#F2C14E; color-scheme: dark; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-size:16px;line-height:1.4}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--faixa);outline-offset:2px}

/* ============ TOPO ============ */
header.top{position:relative;z-index:5;background:var(--asfalto);color:#F4F5F6;padding:12px 16px 10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--asfalto);z-index:10}
.top h1{margin:0;font-size:19px;font-weight:700}
.top .sub{font-size:12.5px;color:#C9CDD1}
.stripe{height:5px;margin-top:8px;background:repeating-linear-gradient(90deg,var(--faixa) 0 26px,transparent 26px 40px)}
.tabs{display:grid;grid-template-columns:1fr 1fr;margin-top:10px;border:1px solid #59616A;border-radius:6px;overflow:hidden}
.tabs button{background:transparent;border:0;color:#DADDE0;padding:8px 0;font-size:15px}
.tabs button[aria-pressed=true]{background:var(--faixa);color:#1F2326;font-weight:700}

main{padding:14px 14px 120px;max-width:720px;margin:0 auto}
.row{display:flex;gap:10px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;flex:1}
.field label,.lbl{font-size:13px;color:var(--muted)}
input[type=text],input[type=date],input[type=number],textarea{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--input);font-size:16px}
textarea{min-height:64px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:12px 14px;font-size:16px;font-weight:600;min-height:48px}
.btn.primary{background:var(--faixa);border-color:var(--faixa);color:#1F2326;font-weight:700}
.btn.dark{background:var(--asfalto);border-color:var(--asfalto);color:#fff}
.btn.block{width:100%}
.btn.small{min-height:38px;padding:7px 12px;font-size:14px}
.btn.danger{color:var(--falha)}
.note{font-size:13px;color:var(--muted);margin:6px 2px}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.empty strong{display:block;color:var(--text);font-size:17px;margin-bottom:6px}

/* ============ CARTÃO DO EQUIPAMENTO ============ */
.eq{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden}
.eq > summary{list-style:none;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.eq > summary::-webkit-details-marker{display:none}
.eq .code{font-size:24px;font-weight:700;font-stretch:condensed;letter-spacing:.3px}
.eq .meta{font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;max-width:62%}
.chip{font-size:12px;padding:3px 8px;border-radius:20px;background:var(--chip);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok);font-weight:700}
.chip.no{background:var(--falha-bg);color:var(--falha);font-weight:700}
.eqbody{padding:0 14px 14px;border-top:1px solid var(--line)}
.step{padding-top:14px}
.step h3{margin:0 0 8px;font-size:16px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.step h3 small{font-weight:400;color:var(--muted);font-size:13px}
.shots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.shot{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;background:var(--chip)}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot span{position:absolute;left:0;bottom:0;right:0;font-size:11px;background:rgba(0,0,0,.55);color:#fff;padding:1px 4px}
.shot button{position:absolute;top:3px;right:3px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:1}
.camrow{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.yn{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.yn button{border:0;background:var(--input);padding:12px 0;font-weight:700;font-size:16px}
.yn button+button{border-left:1px solid var(--line)}
.yn button[data-v=SIM][aria-pressed=true]{background:#2E7D4F;color:#fff}
.yn button[data-v=NÃO][aria-pressed=true]{background:#B3261E;color:#fff}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;border-bottom:1px solid var(--line);font-size:15px}
.checks input{width:22px;height:22px;flex:none;accent-color:#2E7D4F}
.mm{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mm label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;background:var(--input);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.mm input{width:64px;padding:7px;border-radius:6px;border:1px solid var(--line);background:var(--bg);font-size:16px;text-align:center}
.mm input.dv{border:2px solid #D93025;background:var(--falha-bg)}
.rmeq{margin-top:16px}
.sel{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--input);font-size:16px;color:var(--text)}
.sel.dv,input.dv{border:2px solid #D93025;background:var(--falha-bg)}
.pzlist{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.pz{border:1px solid var(--line);border-radius:10px;background:var(--input)}
.pz > summary{list-style:none;padding:11px 12px;display:flex;justify-content:space-between;gap:10px;cursor:pointer;font-size:15px}
.pz > summary::-webkit-details-marker{display:none}
.pz > summary span{color:var(--muted);font-size:13px;text-align:right}
.pz > summary span.dvt{color:var(--falha);font-weight:700}
.pz[open] > summary{border-bottom:1px solid var(--line)}
.pzf{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px 12px}
.pzf label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.pzf > div, .pzf > button, .pzf > .full{grid-column:1/-1}
.yn.cond button[aria-pressed=true]{background:var(--asfalto);color:#fff}
@media (max-width:380px){.pzf{grid-template-columns:1fr}}

/* ============ BARRA INFERIOR ============ */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.bar .btn{width:100%}

/* ============ JANELAS ============ */
dialog{border:0;border-radius:14px;padding:0;width:min(560px,94vw);max-height:86vh;background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dlg{padding:16px;display:flex;flex-direction:column;gap:10px;max-height:86vh}
.dlg h2{margin:0;font-size:18px}
.picklist{overflow:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:2px}
.picklist button{border:1px solid var(--line);background:var(--input);border-radius:8px;padding:10px 0;font-weight:700;font-size:15px}
.picklist button.rod{border-color:var(--faixa)}
.picklist button:disabled{opacity:.35}
.pkh{font-size:13px;color:var(--muted);grid-column:1/-1;margin-top:6px}
.warn{background:var(--aviso-bg);color:var(--text);border-left:4px solid var(--aviso);padding:8px 10px;border-radius:4px;font-size:14px}
.warn ul{margin:4px 0 0 18px;padding:0}
.okbox{background:var(--ok-bg);border-left:4px solid var(--ok);padding:8px 10px;border-radius:4px;font-size:14px}

/* ============ HISTÓRICO ============ */
.hist{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.hist strong{display:block;font-size:17px}
.hist span{font-size:13px;color:var(--muted)}
.storage{font-size:12.5px;color:var(--muted);margin-top:14px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--asfalto);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (min-width:600px){.shots{grid-template-columns:repeat(6,1fr)}.mm{grid-template-columns:repeat(3,1fr)}.picklist{grid-template-columns:repeat(6,1fr)}}
</style>
</head>
<body>
<header class="top">
  <h1>Apontamento de lavagem</h1>
  <div class="sub">Consórcio Nova Rota · Obra 60217 · funciona sem internet</div>
  <div class="stripe" aria-hidden="true"></div>
  <div class="tabs" role="group" aria-label="Telas">
    <button type="button" data-tab="dia" aria-pressed="true">Dia</button>
    <button type="button" data-tab="hist" aria-pressed="false">Histórico</button>
  </div>
</header>

<main id="main"></main>

<div class="bar" id="bar">
  <button type="button" class="btn" id="addEq">+ Equipamento</button>
  <button type="button" class="btn primary" id="finalizar">Finalizar e enviar</button>
</div>

<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="gal" accept="image/*" multiple hidden>

<dialog id="dlgPick"><div class="dlg">

  <button type="button" class="btn" data-close>Cancelar</button>
</div></dialog>

<dialog id="dlgFim"><div class="dlg" id="fimBody"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

const TIPOS_RODADO = {
  basc: { nome: 'Caminhão 6x4 — 11 pneus (basculante, pipa)', eixos: [1, 2, 2], est: true },
  toco: { nome: 'Caminhão/ônibus 4x2 — 7 pneus', eixos: [1, 2], est: true },
  leve: { nome: 'Veículo leve — 5 pneus', eixos: [1, 1], est: true },
  maq4: { nome: 'Máquina — 4 pneus (pá, retro, rolo)', eixos: [1, 1], est: false },
  moto: { nome: 'Motoniveladora — 6 pneus', eixos: [1, 1, 1], est: false }
};
function tipoPadrao(eq) {
  const p = String(eq).toUpperCase();
  if (/^ONB/.test(p)) return 'toco';
  if (/^(VL|CAM|PK|CC|CAR|AMB)/.test(p)) return 'leve';
  if (/^MOT/.test(p)) return 'moto';
  if (/^(PC|RET|RC|RP|MN|CS|PCA|MC|TP)/.test(p)) return 'maq4';
  return 'basc';
}
function posicoesTipo(t) {
  const T = TIPOS_RODADO[t] || TIPOS_RODADO.basc, dir = [], esq = [];
  T.eixos.forEach((d, i) => {
    const n = i + 1;
    if (d === 2) { dir.push([`${n}DI`, `${n}º Direito interno`], [`${n}DE`, `${n}º Direito externo`]); esq.push([`${n}EI`, `${n}º Esquerdo interno`], [`${n}EE`, `${n}º Esquerdo externo`]); }
    else { dir.push([`${n}D`, `${n}º Direito`]); esq.push([`${n}E`, `${n}º Esquerdo`]); }
  });
  return [...dir, ...esq, ...(T.est ? [['EST', 'Estepe']] : [])];
}

const posE = e => posicoesTipo(e.tipo || tipoPadrao(e.eq));
const checklist = eq => isOnibus(eq) ? CHECK_ONB : CHECK_BASC;
const CATS = [['antes', 'Sujo (antes)'], ['depois', 'Limpo (depois)'], ['lub', 'Lubrificação'], ['pneu', 'Ficha de pneus']];

/* ============ BANCO LOCAL (IndexedDB): tudo fica no celular ============ */
let db;
function abrirBanco() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('apontamento-lavagem', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('dias', { keyPath: 'data' });
      const f = d.createObjectStore('fotos', { keyPath: 'id' });
      f.createIndex('data', 'data');
    };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
const tx = (store, mode = 'readonly') => db.transaction(store, mode).objectStore(store);
const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const getDia = data => req(tx('dias').get(data));
const putDia = dia => req(tx('dias', 'readwrite').put(dia));
const todosDias = () => req(tx('dias').getAll());
const fotosDoDia = data => req(tx('fotos').index('data').getAll(data));
const putFoto = f => req(tx('fotos', 'readwrite').put(f));
const delFoto = id => req(tx('fotos', 'readwrite').delete(id));

/* ============ ESTADO ============ */
const pref = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
let tab = 'dia', hoje = ymd(new Date()), dataAtual = hoje, dia = null, fotos = [], aberto = null, alvoFoto = null;
const urls = new Map();
const urlDe = f => { if (!urls.has(f.id)) urls.set(f.id, URL.createObjectURL(f.blob)); return urls.get(f.id); };
const toast = msg => { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2200); };

async function carregarDia(data) {
  dataAtual = data;
  dia = await getDia(data) || { data, equipamentos: [], enviadoEm: null };
  fotos = await fotosDoDia(data);
  render();
}
const salvarDia = () => { dia.alteradoEm = Date.now(); return putDia(dia); };
const eqObj = eq => dia.equipamentos.find(e => e.eq === eq);
const fotosDe = (eq, cat) => fotos.filter(f => f.eq === eq && (!cat || f.cat === cat)).sort((a, b) => a.ts - b.ts);

function checksDe(e) {
  if (e.checksEditado) return e.checks;
  const lav = fotosDe(e.eq, 'depois').length > 0, lub = fotosDe(e.eq, 'lub').length > 0;
  return Object.fromEntries(checklist(e.eq).map((c, i) => [c, i === 0 ? lav : lub]));
}
const duvida = v => /\?/.test(String(v || ''));
const extras = campo => { try { return JSON.parse(localStorage.getItem('ap_opc_' + campo) || '[]'); } catch (e) { return []; } };
const addExtra = (campo, v) => { const l = extras(campo); if (!l.includes(v)) { l.push(v); try { localStorage.setItem('ap_opc_' + campo, JSON.stringify(l)); } catch (e) {} } };
const pzDe = e => { if (!e.pz) { e.pz = {}; for (const [k, v] of Object.entries(e.mm || {})) if (v) e.pz[k] = { prof: v }; } return e.pz; };
const pzPreench = z => z && ['marca', 'dot', 'medida', 'cond', 'modelo', 'prof'].some(c => String(z[c] || '').trim());
function opcoes(campo, valor, e) {
  let lista;
  if (campo === 'marca') lista = MARCAS;
  else if (campo === 'medida') lista = MEDIDAS;
  else if (campo === 'prof') lista = PROFUNDIDADES;
  else { const marca = (e || {}).marca; lista = marca && MODELOS[marca] ? [...MODELOS[marca], ...MODELOS_OBRA] : [...new Set([...Object.values(MODELOS).flat(), ...MODELOS_OBRA])].sort(); }
  const todas = [...new Set([...lista, ...extras(campo)])];
  if (valor && !todas.includes(valor) && valor !== '?') todas.unshift(valor);
  const rot = v => campo === 'prof' ? `${v} mm` : v;
  return `<option value="">Escolher…</option>` + (campo === 'prof' ? `<option value="?" ${valor === '?' ? 'selected' : ''}>Não deu para ler (?)</option>` : '') +
    todas.map(v => `<option value="${esc(v)}" ${v === valor ? 'selected' : ''}>${esc(rot(v))}</option>`).join('') + `<option value="__outro">Outro…</option>`;
}
let openPz = null;

/* ============ TELA DO DIA ============ */
function render() {
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.tab === tab));
  $('#bar').hidden = tab !== 'dia';
  if (tab === 'hist') return renderHist();
  const nome = pref.get('ap_nome', '');
  let h = `<div class="row"><div class="field"><label for="data">Dia</label><input type="date" id="data" value="${dataAtual}"></div>
    <div class="field"><label for="nome">Apropriador</label><input type="text" id="nome" value="${esc(nome)}" placeholder="Seu nome"></div></div>`;
  if (dia.enviadoEm) h += `<p class="note">Enviado em ${br(ymd(new Date(dia.enviadoEm)))} às ${hm(dia.enviadoEm)}. Se mudar algo, finalize e envie de novo.</p>`;
  if (!dia.equipamentos.length) {
    h += `<div class="empty"><strong>Nenhum equipamento neste dia</strong>Toque em “+ Equipamento” quando o primeiro caminhão chegar para lavar.</div>`;
  }
  for (const e of dia.equipamentos) {
    const s = fotosDe(e.eq, 'antes'), l = fotosDe(e.eq, 'depois'), lb = fotosDe(e.eq, 'lub'), pn = fotosDe(e.eq, 'pneu');
    const mmOk = posE(e).filter(([k]) => pzPreench(pzDe(e)[k])).length;
    const chips = [
      s.length ? `<span class="chip ok">Sujo ${hm(s[0].ts)}</span>` : `<span class="chip">Sujo</span>`,
      l.length ? `<span class="chip ok">Limpo ${hm(l[0].ts)}</span>` : `<span class="chip">Limpo</span>`,
      lb.length ? `<span class="chip ok">Lub. ${lb.length}</span>` : `<span class="chip">Lub.</span>`,
      e.pneu ? `<span class="chip ${e.pneu === 'SIM' ? 'ok' : 'no'}">Calibr. ${e.pneu}</span>` : `<span class="chip">Calibr.</span>`
    ].join('');
    const open = aberto === e.eq ? 'open' : '';
    h += `<details class="eq" data-eq="${e.eq}" ${open}><summary><div><div class="code">${e.eq}</div>
      <div class="meta">${s.length + l.length + lb.length + pn.length} fotos${mmOk ? ` · pneus ${mmOk}/${posE(e).length}` : ''}</div></div><div class="chips">${chips}</div></summary>
      <div class="eqbody">`;
    CATS.forEach(([cat, nomeCat], i) => {
      const arr = fotosDe(e.eq, cat);
      h += `<section class="step"><h3>${i + 1}. ${nomeCat} <small>${arr.length ? `${arr.length} foto${arr.length > 1 ? 's' : ''} · ${hm(arr[0].ts)}` : 'sem foto'}</small></h3>
        ${arr.length ? `<div class="shots">${arr.map(f => `<div class="shot"><img src="${urlDe(f)}" alt="${nomeCat}"><span>${hm(f.ts)}</span><button type="button" data-del="${f.id}" aria-label="Apagar foto">×</button></div>`).join('')}</div>` : ''}
        <div class="camrow"><button type="button" class="btn ${cat === 'antes' && !arr.length ? 'primary' : ''}" data-cam="${cat}">📷 Tirar foto</button><button type="button" class="btn" data-gal="${cat}">Galeria</button></div>`;
      if (cat === 'lub') {
        const ck = checksDe(e);
        h += `<div class="checks" style="margin-top:8px">${Object.entries(ck).map(([c, v]) => `<label><input type="checkbox" data-ck="${esc(c)}" ${v ? 'checked' : ''}>${esc(c)}</label>`).join('')}</div>`;
      }
      if (cat === 'pneu') {
        h += `<div class="lbl" style="margin-top:12px">Calibragem de pneus</div>
          <div class="yn" role="group" aria-label="Calibragem de pneus"><button type="button" data-pneu="SIM" data-v="SIM" aria-pressed="${e.pneu === 'SIM'}">SIM</button><button type="button" data-pneu="NÃO" data-v="NÃO" aria-pressed="${e.pneu === 'NÃO'}">NÃO</button></div>
          <div class="lbl" style="margin-top:14px">Tipo de rodado</div>
          <select class="sel" data-tipo>${Object.entries(TIPOS_RODADO).map(([k, t]) => `<option value="${k}" ${(e.tipo || tipoPadrao(e.eq)) === k ? 'selected' : ''}>${t.nome}</option>`).join('')}</select>
          ${e.pzOrigem ? `<div class="warn" style="margin-top:8px">Pneus copiados da medição de ${br(e.pzOrigem)}. Confira e ajuste o que mudou (principalmente a profundidade).</div>` : ''}
          <div class="lbl" style="margin-top:12px">Pneus — toque em cada posição para preencher</div>
          <div class="pzlist">${posE(e).map(([k, n]) => { const z = pzDe(e)[k] || {}; const id = e.eq + '|' + k;
            const res = [z.marca, z.medida, z.cond, z.prof ? (z.prof === '?' ? '⚠ ? mm' : z.prof + ' mm') : ''].filter(Boolean).join(' · ');
            return `<details class="pz" data-pos="${k}" ${openPz === id ? 'open' : ''}><summary><b>${n}</b><span class="${duvida(z.prof) || duvida(z.dot) ? 'dvt' : ''}">${esc(res) || 'não preenchido'}</span></summary>
              <div class="pzf">
                <label>Marca<select class="sel" data-z="marca">${opcoes('marca', z.marca)}</select></label>
                <label>DOT (digitar)<input type="text" data-z="dot" value="${esc(z.dot || '')}" autocapitalize="characters" placeholder="ex.: 0556A1CH" class="${duvida(z.dot) ? 'dv' : ''}"></label>
                <label>Medida<select class="sel" data-z="medida">${opcoes('medida', z.medida)}</select></label>
                <label>Profundidade<select class="sel ${duvida(z.prof) ? 'dv' : ''}" data-z="prof">${opcoes('prof', z.prof)}</select></label>
                <div><span class="lbl">Condição</span><div class="yn cond" role="group" aria-label="Condição">${CONDICOES.map(c => `<button type="button" data-zc="${c}" aria-pressed="${z.cond === c}">${c.toUpperCase()}</button>`).join('')}</div></div>
                <label class="full">Modelo / desenho<select class="sel" data-z="modelo">${opcoes('modelo', z.modelo, z)}</select></label>
                <button type="button" class="btn small" data-copiar="${k}">Copiar marca, medida e modelo para os pneus vazios</button>
              </div></details>`; }).join('')}</div>`;
      }
      h += `</section>`;
    });
    h += `<section class="step"><h3>5. Outras informações</h3>
        <div class="field"><label>Horímetro / Km</label><input type="text" inputmode="decimal" data-f="hor" value="${esc(e.hor || '')}" placeholder="ex.: 12.540"></div>
        <div class="field" style="margin-top:8px"><label>Observação</label><textarea data-f="obs" placeholder="Ex.: oxidação em pinos, folga, avaria encontrada">${esc(e.obs || '')}</textarea></div>
      </section>
      <button type="button" class="btn small danger rmeq" data-rm="${e.eq}">Remover ${e.eq} deste dia</button>
      </div></details>`;
  }
  $('#main').innerHTML = h;
}

/* ============ AÇÕES ============ */
$('#main').addEventListener('change', async ev => {
  const t = ev.target;
  if (t.id === 'data') { aberto = null; await carregarDia(t.value || hoje); return; }
  if (t.id === 'nome') { pref.set('ap_nome', t.value.trim()); return; }
  const card = t.closest('.eq'); if (!card) return;
  const e = eqObj(card.dataset.eq);
  if (t.dataset.ck !== undefined) { e.checks = { ...checksDe(e), [t.dataset.ck]: t.checked }; e.checksEditado = true; await salvarDia(); }
  if (t.dataset.tipo !== undefined) { e.tipo = t.value; await salvarDia(); render(); }
  if (t.dataset.z && t.tagName === 'SELECT') {
    const k = t.closest('.pz').dataset.pos, campo = t.dataset.z; let v = t.value;
    if (v === '__outro') {
      const nomes = { marca: 'a marca', medida: 'a medida (ex.: 275/80R22,5)', modelo: 'o modelo / desenho', prof: 'a profundidade em mm' };
      v = (prompt(`Digite ${nomes[campo]}:`) || '').trim();
      if (!v) { render(); return; }
      if (campo === 'prof') v = v.replace('.', ',').replace(/\s*mm$/i, '');
      addExtra(campo, v);
    }
    const pz = pzDe(e); pz[k] = { ...(pz[k] || {}), [campo]: v }; openPz = e.eq + '|' + k;
    await salvarDia(); render();
  }
});
$('#main').addEventListener('input', async ev => {
  const t = ev.target; const card = t.closest('.eq'); if (!card) return;
  const e = eqObj(card.dataset.eq);
  if (t.dataset.f) { e[t.dataset.f] = t.value; await salvarDia(); }
  if (t.dataset.z === 'dot') { const k = t.closest('.pz').dataset.pos; const pz = pzDe(e); pz[k] = { ...(pz[k] || {}), dot: t.value.trim().toUpperCase() }; t.classList.toggle('dv', duvida(t.value)); await salvarDia(); }
});
$('#main').addEventListener('click', async ev => {
  const b = ev.target.closest('button'); const card = ev.target.closest('.eq');
  const pzs = ev.target.closest('.pz > summary');
  if (pzs) { const d = pzs.parentElement; setTimeout(() => { openPz = d.open ? card.dataset.eq + '|' + d.dataset.pos : null; }, 0); return; }
  if (ev.target.closest('summary') && card) { setTimeout(() => { aberto = card.open ? card.dataset.eq : null; }, 0); return; }
  if (!b || !card) return;
  const eq = card.dataset.eq; aberto = eq;
  if (b.dataset.cam) { alvoFoto = { eq, cat: b.dataset.cam }; $('#cam').value = ''; $('#cam').click(); }
  else if (b.dataset.gal) { alvoFoto = { eq, cat: b.dataset.gal }; $('#gal').value = ''; $('#gal').click(); }
  else if (b.dataset.del) {
    if (!confirm('Apagar esta foto?')) return;
    await delFoto(b.dataset.del); fotos = fotos.filter(f => f.id !== b.dataset.del); render();
  } else if (b.dataset.zc) {
    const e = eqObj(eq), k = b.closest('.pz').dataset.pos, pz = pzDe(e);
    pz[k] = { ...(pz[k] || {}), cond: (pz[k] || {}).cond === b.dataset.zc ? '' : b.dataset.zc }; openPz = eq + '|' + k; await salvarDia(); render();
  } else if (b.dataset.copiar) {
    const e = eqObj(eq), pz = pzDe(e), src = pz[b.dataset.copiar] || {}; let n = 0;
    for (const [k] of posE(e)) { if (k === b.dataset.copiar) continue; const z = pz[k] || {};
      const novo = { ...z }; ['marca', 'medida', 'modelo'].forEach(c => { if (!z[c] && src[c]) { novo[c] = src[c]; n++; } }); pz[k] = novo; }
    await salvarDia(); render(); toast(n ? 'Copiado para os pneus vazios' : 'Nada para copiar');
  } else if (b.dataset.pneu) {
    const e = eqObj(eq); e.pneu = e.pneu === b.dataset.pneu ? '' : b.dataset.pneu; await salvarDia(); render();
  } else if (b.dataset.rm) {
    const n = fotosDe(eq).length;
    if (!confirm(`Remover ${eq} deste dia${n ? ` e apagar ${n} foto(s)` : ''}?`)) return;
    for (const f of fotosDe(eq)) await delFoto(f.id);
    fotos = fotos.filter(f => f.eq !== eq); dia.equipamentos = dia.equipamentos.filter(x => x.eq !== eq); aberto = null;
    await salvarDia(); render();
  }
});

/* fotos: reduz no próprio celular (leve para enviar) e grava com a hora */
async function reduzir(file) {
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) { bmp = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
  const w = bmp.width || bmp.naturalWidth, h = bmp.height || bmp.naturalHeight, k = Math.min(1, 1400 / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, 'image/jpeg', 0.75));
}
async function receberFotos(files, daGaleria) {
  if (!alvoFoto || !files.length) return;
  toast('Salvando foto…');
  for (const file of files) {
    try {
      const blob = await reduzir(file);
      const ts = daGaleria && file.lastModified && ymd(new Date(file.lastModified)) === dataAtual ? file.lastModified : Date.now();
      const f = { id: `${dataAtual}_${alvoFoto.eq}_${alvoFoto.cat}_${ts}_${Math.random().toString(36).slice(2, 7)}`, data: dataAtual, eq: alvoFoto.eq, cat: alvoFoto.cat, ts, blob };
      await putFoto(f); fotos.push(f);
    } catch (e) { toast('Não consegui abrir essa foto. Tente de novo.'); }
  }
  await salvarDia(); render(); toast(files.length > 1 ? `${files.length} fotos salvas` : 'Foto salva');
}
$('#cam').addEventListener('change', e => receberFotos([...e.target.files], false));
$('#gal').addEventListener('change', e => receberFotos([...e.target.files], true));

/* escolher equipamento */
function listaPick(filtro = '') {
  const f = filtro.toUpperCase().replace(/\s/g, '');
  const ja = new Set(dia.equipamentos.map(e => e.eq));
  const casa = x => !f || x.replace('-', '').includes(f.replace('-', ''));
  const rod = RODIZIO.filter(casa), outros = FROTA.filter(x => !RODIZIO.includes(x) && casa(x));
  let h = rod.length ? `<div class="pkh">Frota do rodízio de lavagem</div>` + rod.map(x => `<button type="button" class="rod" data-pick="${x}" ${ja.has(x) ? 'disabled' : ''}>${x}</button>`).join('') : '';
  if (f && outros.length) h += `<div class="pkh">Outros equipamentos</div>` + outros.slice(0, 40).map(x => `<button type="button" data-pick="${x}" ${ja.has(x) ? 'disabled' : ''}>${x}</button>`).join('');
  const livre = filtro.trim().toUpperCase();
  if (livre && !rod.includes(livre) && !outros.includes(livre)) h += `<div class="pkh">Não está na lista?</div><button type="button" data-pick="${esc(livre)}" style="grid-column:span 2">Usar “${esc(livre)}”</button>`;
  $('#picklist').innerHTML = h || '<p class="note" style="grid-column:1/-1">Nenhum equipamento encontrado.</p>';
}
$('#addEq').addEventListener('click', () => { $('#busca').value = ''; listaPick(); $('#dlgPick').showModal(); });
$('#busca').addEventListener('input', e => listaPick(e.target.value));
$('#picklist').addEventListener('click', async ev => {
  const b = ev.target.closest('[data-pick]'); if (!b) return;
  const eq = b.dataset.pick;
  const novo = { eq, criadoEm: Date.now(), pneu: '', pz: {}, hor: '', obs: '' };
  // pneus mudam pouco: traz a última medição desse equipamento para só conferir
  const ant = (await todosDias()).filter(d => d.data < dataAtual).sort((a, b) => b.data.localeCompare(a.data))
    .map(d => [d.data, d.equipamentos.find(x => x.eq === eq)]).find(([, x]) => x && x.pz && Object.values(x.pz).some(pzPreench));
  if (ant) { novo.pz = JSON.parse(JSON.stringify(ant[1].pz)); novo.tipo = ant[1].tipo; novo.pzOrigem = ant[0]; }
  dia.equipamentos.push(novo);
  aberto = eq; await salvarDia(); $('#dlgPick').close(); render();
  const card = document.querySelector(`.eq[data-eq="${CSS.escape(eq)}"]`); if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
});
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => b.closest('dialog').close()));

/* ============ FINALIZAR: gera o arquivo do dia ============ */
const toDataURL = blob => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(blob); });
function pendencias() {
  const p = [];
  for (const e of dia.equipamentos) {
    const falta = [];
    if (!fotosDe(e.eq, 'antes').length) falta.push('foto sujo');
    if (!fotosDe(e.eq, 'depois').length) falta.push('foto limpo');
    if (!fotosDe(e.eq, 'lub').length) falta.push('fotos de lubrificação');
    if (!e.pneu) falta.push('calibragem SIM/NÃO');
    if (falta.length) p.push(`<li><b>${e.eq}:</b> sem ${falta.join(', ')}</li>`);
  }
  return p;
}
$('#finalizar').addEventListener('click', () => {
  if (!dia.equipamentos.length) { toast('Adicione pelo menos um equipamento.'); return; }
  const p = pendencias(), nome = pref.get('ap_nome', '');
  $('#fimBody').innerHTML = `<h2>Finalizar ${dow(dataAtual)}, ${br(dataAtual)}</h2>
    <p class="note" style="margin:0">${dia.equipamentos.length} equipamento(s) · ${fotos.length} fotos</p>
    ${p.length ? `<div class="warn"><b>Faltando:</b><ul>${p.join('')}</ul>Você pode enviar assim mesmo e completar depois.</div>` : `<div class="okbox">Tudo preenchido.</div>`}
    ${!nome ? `<div class="field"><label for="nome2">Seu nome (vai no arquivo)</label><input type="text" id="nome2" placeholder="Apropriador"></div>` : ''}
    <button type="button" class="btn primary block" id="gerar">Gerar arquivo e enviar</button>
    <button type="button" class="btn block" data-close>Voltar</button>`;
  $('#fimBody').querySelector('[data-close]').addEventListener('click', () => $('#dlgFim').close());
  $('#gerar').addEventListener('click', gerarArquivo);
  $('#dlgFim').showModal();
});
async function gerarArquivo() {
  const n2 = $('#nome2'); if (n2 && n2.value.trim()) pref.set('ap_nome', n2.value.trim());
  const nome = pref.get('ap_nome', '');
  const btn = $('#gerar'); btn.disabled = true; btn.textContent = 'Gerando…';
  const out = { tipo: 'apontamento-lavagem-nova-rota', versao: 1, obra: '60217', data: dataAtual, apropriador: nome, geradoEm: new Date().toISOString(), equipamentos: [] };
  for (const e of dia.equipamentos) {
    const fs = [];
    for (const f of fotosDe(e.eq)) fs.push({ cat: f.cat, ts: f.ts, dados: await toDataURL(f.blob) });
    out.equipamentos.push({ eq: e.eq, horimetro: e.hor || '', calibragem: e.pneu || '', observacao: e.obs || '',
      checklist: e.checksEditado ? e.checks : null, pneus: { data: dataAtual, tipo: e.tipo || tipoPadrao(e.eq), pos: pzDe(e), mm: Object.fromEntries(Object.entries(pzDe(e)).map(([k, z]) => [k, (z || {}).prof || ''])) }, fotos: fs });
  }
  const nomeArq = `Lavagem ${dataAtual}${nome ? ' - ' + nome.replace(/[\\/:*?"<>|]/g, '') : ''}.json`;
  const file = new File([JSON.stringify(out)], nomeArq, { type: 'application/json' });
  const mb = (file.size / 1048576).toFixed(1);
  dia.enviadoEm = Date.now(); await salvarDia();
  let enviado = false;
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: nomeArq, text: `Apontamento de lavagem ${br(dataAtual)}` }); enviado = true;
    }
  } catch (e) { if (e.name === 'AbortError') { btn.disabled = false; btn.textContent = 'Gerar arquivo e enviar'; return; } }
  if (!enviado) { const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = nomeArq; document.body.appendChild(a); a.click(); a.remove(); }
  $('#fimBody').innerHTML = `<h2>Pronto</h2><div class="okbox">Arquivo <b>${esc(nomeArq)}</b> (${mb} MB) ${enviado ? 'enviado' : 'salvo em Downloads'}.</div>
    <p class="note">${enviado ? '' : 'Mande esse arquivo para o controle de manutenção (WhatsApp ou e-mail). '}Ele importa no sistema de relatório e gera o relatório do dia.</p>
    <button type="button" class="btn block" id="okfim">Fechar</button>`;
  $('#okfim').addEventListener('click', () => { $('#dlgFim').close(); render(); });
}

/* ============ HISTÓRICO ============ */
async function renderHist() {
  const ds = (await todosDias()).filter(d => d.equipamentos.length).sort((a, b) => b.data.localeCompare(a.data));
  let h = ds.length ? '' : `<div class="empty"><strong>Sem histórico ainda</strong>Os dias apontados aparecem aqui.</div>`;
  for (const d of ds) {
    h += `<div class="hist"><div><strong>${dow(d.data)}, ${br(d.data)}</strong><span>${d.equipamentos.map(e => e.eq).join(', ')}</span><br>
      <span>${d.enviadoEm ? `Enviado às ${hm(d.enviadoEm)}` : 'Ainda não enviado'}</span></div>
      <button type="button" class="btn small" data-abrir="${d.data}">Abrir</button></div>`;
  }
  try { const est = await navigator.storage.estimate(); h += `<p class="storage">Espaço usado no celular: ${(est.usage / 1048576).toFixed(0)} MB. Dias antigos já enviados podem ser apagados para liberar espaço.</p>`; } catch (e) {}
  if (ds.some(d => d.enviadoEm && d.data < hoje)) h += `<button type="button" class="btn small danger" id="limpar">Apagar dias enviados há mais de 30 dias</button>`;
  $('#main').innerHTML = h;
}
$('#main').addEventListener('click', async ev => {
  const b = ev.target.closest('[data-abrir]');
  if (b) { tab = 'dia'; aberto = null; await carregarDia(b.dataset.abrir); return; }
  if (ev.target.id === 'limpar') {
    if (!confirm('Apagar do celular os dias enviados há mais de 30 dias? (os arquivos já enviados não são afetados)')) return;
    const lim = new Date(); lim.setDate(lim.getDate() - 30); const limS = ymd(lim);
    for (const d of await todosDias()) if (d.enviadoEm && d.data < limS) {
      for (const f of await fotosDoDia(d.data)) await delFoto(f.id);
      await req(tx('dias', 'readwrite').delete(d.data));
    }
    renderHist(); toast('Espaço liberado');
  }
});
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', async () => {
  tab = b.dataset.tab; if (tab === 'dia') await carregarDia(dataAtual); else render();
}));

/* ============ INÍCIO ============ */
(async () => {
  try { db = await abrirBanco(); } catch (e) { $('#main').innerHTML = '<div class="empty"><strong>Não foi possível abrir o armazenamento</strong>Abra pelo link do sistema no Chrome (não em aba anônima).</div>'; return; }
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
  await carregarDia(hoje);
})();
})();
</script>
